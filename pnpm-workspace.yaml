packages:
  - 'packages/*'
  - 'examples'
  - 'examples/*'

# pnpm settings. They live here, not in .npmrc, so npm does not warn about them.
strictPeerDependencies: false
saveExact: true

# Dependencies allowed to run install scripts (pnpm 10 blocks them by default).
# esbuild's postinstall checks that its platform binary matches the version.
onlyBuiltDependencies:
  - esbuild

# These have install scripts but ship prebuilt binaries through optional
# platform packages, so their scripts are not needed. Listed so pnpm doesn't warn.
ignoredBuiltDependencies:
  - '@parcel/watcher'
  - lmdb
  - msgpackr-extract

# `pnpm audit` (run in CI at --audit-level high) skips these advisories.
auditConfig:
  ignoreGhsas:
    # picomatch ReDoS. Every picomatch release up to 4.0.7 is affected and no
    # fixed release exists yet (patched versions: none), so there is nothing to
    # upgrade to. Remove this entry once a fixed picomatch ships and the
    # lockfile resolves it; `pnpm audit` will then pass without it.
    - GHSA-fc5q-39xc-vjpf
