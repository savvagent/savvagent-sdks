[package]
name = "savvagent"
version = "0.1.0"
edition = "2021"
authors = ["Savvagent Team <support@savvagent.com>"]
description = "Rust Server SDK for Savvagent feature flags with AI-powered error detection"
license = "MIT"
repository = "https://github.com/savvagent/savvagent-sdks"
homepage = "https://savvagent.com"
documentation = "https://docs.rs/savvagent"
keywords = ["feature-flags", "feature-toggles", "savvagent", "ai"]
categories = ["web-programming", "api-bindings"]
readme = "README.md"

[dependencies]
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
thiserror = "1.0"
tracing = "0.1"

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"
