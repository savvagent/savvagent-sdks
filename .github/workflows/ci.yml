name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Run on merge-queue entries too, so the queue tests the merged result.
  merge_group:

permissions:
  contents: read

# A new push to a pull request cancels that pull request's older runs. Pushes to
# master and merge-queue runs each get a group of their own (the run id), so they
# are never cancelled or replaced while queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Ignored advisories are listed, with reasons, under auditConfig in
      # pnpm-workspace.yaml.
      - name: Audit dependencies
        run: pnpm audit --audit-level high

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      # Packs every published package and runs publint and attw on the tarball.
      # Ignored attw rules are listed, with reasons, in scripts/check-packages.mjs.
      - name: Check package shape
        run: pnpm check:packages --no-build

      - name: Test
        run: pnpm test

  e2e:
    name: E2E Tests (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        app:
          - react-app
          - nextjs-app
          - angular-app
          - vue-app
          - svelte-app
          - sveltekit-app
          - astro-app
          - solid-app
          - react-router-app

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Install Playwright browsers
        run: cd examples && npx playwright install --with-deps chromium

      - name: Run E2E tests for ${{ matrix.app }}
        id: e2e
        run: cd examples && pnpm test:e2e:${{ matrix.app }}
        env:
          SAVVAGENT_FLAGS_API_URL: https://api.savvagent.com/flags
          SAVVAGENT_FLAGS_API_KEY: ${{ secrets.SAVVAGENT_SDK_KEY }}
          VITE_SAVVAGENT_FLAGS_API_URL: https://api.savvagent.com/flags
          VITE_SAVVAGENT_FLAGS_API_KEY: ${{ secrets.SAVVAGENT_SDK_KEY }}
          NEXT_PUBLIC_SAVVAGENT_FLAGS_API_URL: https://api.savvagent.com/flags
          NEXT_PUBLIC_SAVVAGENT_FLAGS_API_KEY: ${{ secrets.SAVVAGENT_SDK_KEY }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.app }}
          path: examples/playwright-report/
          retention-days: 30

      - name: Upload test screenshots
        if: failure() || steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-screenshots-${{ matrix.app }}
          path: examples/test-results/
          retention-days: 7

  rust:
    name: Rust SDK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            packages/rust-server
            examples/rust-server

      - name: Format (SDK)
        working-directory: packages/rust-server
        run: cargo fmt --check

      - name: Clippy (SDK)
        working-directory: packages/rust-server
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test (SDK)
        working-directory: packages/rust-server
        run: cargo test --locked

      - name: Format (example)
        working-directory: examples/rust-server
        run: cargo fmt --check

      - name: Clippy (example)
        working-directory: examples/rust-server
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test (example)
        working-directory: examples/rust-server
        run: cargo test --locked

  python:
    name: Python SDK (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 'default' lets uv pick the interpreter, as before. '3.9' is the
        # requires-python floor in packages/python-server/pyproject.toml; it
        # runs pytest only, because mypy targets 3.10 and the lint and example
        # checks don't depend on the interpreter.
        python: ['default', '3.9']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          cache-dependency-glob: packages/python-server/uv.lock
          python-version: ${{ matrix.python != 'default' && matrix.python || '' }}

      - name: Lint
        if: matrix.python == 'default'
        working-directory: packages/python-server
        run: uv run --locked --extra dev ruff check .

      - name: Type check
        if: matrix.python == 'default'
        working-directory: packages/python-server
        run: uv run --locked --extra dev mypy

      - name: Test
        working-directory: packages/python-server
        run: uv run --locked --extra dev pytest

      - name: Compile examples
        if: matrix.python == 'default'
        run: python3 -m py_compile examples/python-server/*.py packages/python-server/examples/*.py

  go:
    name: Go SDK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache-dependency-path: examples/go-server/go.sum

      - name: Check formatting
        working-directory: packages/go-server
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needs to be run on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check formatting (example)
        working-directory: examples/go-server
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needs to be run on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        working-directory: packages/go-server
        run: go vet ./...

      - name: Test
        working-directory: packages/go-server
        run: go test -race ./...

      - name: Build example
        working-directory: examples/go-server
        run: go build -o /dev/null ./...

  java:
    name: Java SDK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test SDK
        working-directory: packages/java-server
        run: mvn -B install

      - name: Compile example
        working-directory: examples/java-server
        run: mvn -B compile
