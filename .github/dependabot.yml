version: 2
updates:
  # One pnpm workspace: Dependabot reads the root pnpm-lock.yaml and updates
  # every package and example in it.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Security fixes for transitive and dev dependencies, in one PR.
      security:
        applies-to: security-updates
        patterns: ['*']
      # Routine minor and patch bumps, in one PR. Majors arrive one per PR
      # so each can be reviewed.
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ['*']

  # Workflow actions are pinned to commit SHAs with a version comment;
  # Dependabot bumps both, all in one weekly PR.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ['*']
    ignore:
      # changesets/action v2 requires Changesets CLI v3 and renames its inputs,
      # so it is upgraded together with @changesets/cli, by hand.
      - dependency-name: changesets/action
        update-types: ['version-update:semver-major']
